# Agenda des événements nature et finance (France, Europe, Suisse, Royaume-Uni + références internationales).
#
# Règle : aucun événement n'est ajouté sans vérification sur une source officielle (page de l'organisateur
# ou de l'institution). Le champ `source` indique la page consultée, `verifie_le` la date de vérification.
# Les candidats détectés automatiquement sont écrits dans data/interim/events_candidates.csv : ils ne
# deviennent des événements qu'après validation manuelle.
#
# Champs :
#   id, titre, debut (AAAA-MM-JJ), fin (AAAA-MM-JJ, optionnel), horaire (texte libre, optionnel)
#   lieu, pays (FR | UE | CH | UK | INT), format (présentiel | visio | hybride)
#   organisateur, lien, themes (liste, voir src/lib.py THEMES), cout (optionnel)
#   note (optionnel), confiance (haute | moyenne), verifie_le, source
#
# `confiance: moyenne` = information issue d'une source secondaire, d'un « save the date » sans programme
# ou dont un détail (par exemple l'année) est déduit du contexte : à revérifier avant de s'engager.

