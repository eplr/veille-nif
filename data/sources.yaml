# Registre des sources de la veille Nature in Finance.
#
# Champs :
#   id         identifiant stable (minuscules, sans espace)
#   nom        nom affiché
#   pays       FR, UE, CH, UK ou INT (références internationales)
#   categorie  institution | standard | think_tank | presse | recherche | appels
#   langue     fr, en ou de
#   url        page d'accueil de la source (citée dans le pack copier-coller)
#   rss        URL d'un flux RSS/Atom vérifié, ou null
#   domaine    domaine utilisé pour la requête Google News « site: » quand il n'y a pas de flux
#   filtre     "aucun" : tous les articles sont retenus (source spécialisée)
#              "mots_cles" : seuls les articles qui parlent de nature et de biodiversité sont retenus
#              "mots_cles_large" : idem, plus agriculture, paysans, environnement (fonds et fondations)
#   verif      date de la dernière vérification du flux (AAAA-MM-JJ)
#
# Pour ajouter une source : copier un bloc, renseigner rss si un flux valide existe,
# sinon renseigner domaine. Lancer ensuite `python src/news_watch.py --check-sources`.

sources:
